@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:${t.scrTrk};}
::-webkit-scrollbar-thumb{background:${t.scrThm};border-radius:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 18px #6366f130}50%{box-shadow:0 0 36px #6366f160}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bg{from{transform:translateY(0)}to{transform:translateY(-50px)}}
@keyframes toast{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.fu{animation:fadeUp .4s ease both}.fi{animation:fadeIn .3s ease both}
.float{animation:float 4s ease-in-out infinite}.glow{animation:glow 3s ease-in-out infinite}
.title-font{font-family:'Roboto',sans-serif !important;font-weight:700;letter-spacing:-.01em;}
input,select,textarea{font-family:'Outfit',sans-serif;}
.inp{width:100%;background:${t.inpBg};border:1.5px solid ${t.brdInp};color:${t.tx1};border-radius:11px;padding:12px 14px;font-size:13.5px;outline:none;transition:border .2s,box-shadow .2s;}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11a;}.inp.err{border-color:#ef4444;}
.inp::placeholder{color:${t.tx5};}
.pbtn{width:100%;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:11px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;letter-spacing:.02em;}
.pbtn:hover:not(:disabled){background:linear-gradient(135deg,#818cf8,#6366f1);transform:translateY(-1px);box-shadow:0 8px 22px #6366f13a;}
.pbtn:disabled{opacity:.45;cursor:not-allowed;}
.gbtn{cursor:pointer;border:1.5px solid ${t.brdInp};background:transparent;color:${t.tx3};border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;transition:all .2s;}
.gbtn:hover{background:${t.navHvr};color:${t.tx2};}
.dbtn{cursor:pointer;background:#ef444414;color:#ef4444;border:1px solid #ef444428;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;transition:all .2s;}
.dbtn:hover{background:#ef444422;}
.abtn{cursor:pointer;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;transition:all .2s;}
.abtn:hover{transform:translateY(-1px);box-shadow:0 4px 14px #6366f138;}
.ebtn{cursor:pointer;background:#6366f114;color:#818cf8;border:1px solid #6366f128;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;transition:all .2s;}
.ebtn:hover{background:#6366f120;border-color:#6366f160;}
.nav{cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;transition:all .2s;font-size:13.5px;font-weight:500;color:${t.tx3};}
.nav:hover{background:${t.navHvr};color:${t.tx2};}
.nav.act{background:linear-gradient(135deg,#6366f11e,#4f46e50e);color:#818cf8;border:1px solid #6366f12a;}
.nav.lck{opacity:.28;cursor:not-allowed;}
.kpi{background:${t.cardBg2};border:1px solid ${t.brdMid};border-radius:15px;padding:20px 22px;transition:transform .2s,box-shadow .2s;cursor:default;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 26px #00000018;}
.kpi-won{background:${t.wonBg};border:1px solid #10b98128;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;}
.av{display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:700;flex-shrink:0;}
.row{transition:background .12s;border-radius:10px;cursor:default;}.row:hover{background:${t.rowHvr};}
.cb{width:18px;height:18px;border-radius:5px;border:2px solid ${t.brdInp};background:transparent;cursor:pointer;appearance:none;flex-shrink:0;transition:all .15s;}
.cb:checked{background:#6366f1;border-color:#6366f1;}
.spin{width:18px;height:18px;border:2px solid ${t.spBrd};border-top-color:${t.spTop};border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(8px);animation:fadeIn .2s ease;}
.mbox{background:${t.modalBg};border:1px solid ${t.brdMid};border-radius:20px;padding:28px;animation:scaleIn .25s ease;}
.bar{background:${t.brdMid};border-radius:4px;height:5px;overflow:hidden;}
.bfill{height:100%;border-radius:4px;transition:width .55s ease;}
.status-sel{background:${t.inpBg};border:1.5px solid;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;outline:none;transition:all .2s;}
.detail-row{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid ${t.brd};}
.chart-pill{cursor:pointer;border:1.5px solid ${t.brdInp};background:transparent;color:${t.tx3};border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;transition:all .18s;}
.chart-pill.on{background:#6366f118;border-color:#6366f160;color:#818cf8;}
.chart-pill:hover:not(.on){background:${t.navHvr};color:${t.tx2};}
.range-pill{cursor:pointer;border:1.5px solid ${t.brdInp};background:transparent;color:${t.tx3};border-radius:7px;padding:4px 11px;font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;transition:all .18s;}
.range-pill.on{background:#6366f118;border-color:#6366f160;color:#818cf8;}
.range-pill:hover:not(.on){background:${t.navHvr};color:${t.tx2};}
.sf-chip{cursor:pointer;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid;transition:all .18s;font-family:'Outfit',sans-serif;}
.kpi-filter-bar{background:${t.cardBg};border:1px solid ${t.brdMid};border-radius:14px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.lc-tooltip{position:absolute;background:${t.ttBg};border:1px solid #6366f140;border-radius:8px;padding:6px 10px;font-size:12px;color:${t.tx1};pointer-events:none;white-space:nowrap;z-index:10;}
